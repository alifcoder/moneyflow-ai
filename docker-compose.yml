services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: moneyflow_app
        working_dir: /var/www/moneyflow-ai
        volumes:
            - .:/var/www/moneyflow-ai
        depends_on:
            - postgres
            - redis

    web:
        image: nginx:alpine
        container_name: moneyflow_web
        ports:
            - "8088:80"
        volumes:
            - .:/var/www/moneyflow-ai
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    postgres:
        image: postgres:17-alpine
        container_name: moneyflow_postgres
        ports:
            - "5439:5432"
        environment:
            POSTGRES_DB: moneyflow
            POSTGRES_USER: moneyflow
            POSTGRES_PASSWORD: "MJW3vBQ!ibM%v9"
        volumes:
            - moneyflow_pgdata:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        container_name: moneyflow_redis
        ports:
            - "6389:6379"
        volumes:
            - moneyflow_redis:/data

    node:
        image: node:24-alpine
        container_name: moneyflow_node
        working_dir: /var/www/moneyflow-ai
        volumes:
            - .:/var/www/moneyflow-ai
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        ports:
            - "5173:5173"

volumes:
    moneyflow_pgdata:
    moneyflow_redis:
